<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Pupitre de trace Graphtec CE6000-60</title>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#2f3540"/>

  <!-- La feuille, posee de biais : c'est un traceur a plat -->
  <rect x="11" y="20" width="42" height="30" rx="2"
        fill="#f4f2ed" opacity="0.93"/>
  <rect x="11" y="20" width="42" height="30" rx="2"
        fill="none" stroke="#1d2228" stroke-width="1" opacity="0.5"/>

  <!-- Le trace : une courbe et un cercle, ce que la machine sait faire -->
  <path d="M16 44 C 22 30, 30 30, 34 38 S 44 46, 49 32"
        fill="none" stroke="#ff8a00" stroke-width="2.6"
        stroke-linecap="round"/>
  <circle cx="42" cy="27" r="3.4" fill="none" stroke="#ff8a00"
          stroke-width="2"/>

  <!-- Le porte-outil, descendu sur la feuille -->
  <rect x="27" y="7" width="10" height="13" rx="2.5" fill="#8f9aa6"/>
  <rect x="27" y="7" width="10" height="13" rx="2.5"
        fill="none" stroke="#1d2228" stroke-width="1" opacity="0.45"/>
  <path d="M29.5 20 L34.5 20 L32 26 Z" fill="#ff8a00"/>

  <!-- Les galets d'entrainement, de part et d'autre -->
  <circle cx="9" cy="35" r="3.2" fill="#8f9aa6"/>
  <circle cx="55" cy="35" r="3.2" fill="#8f9aa6"/>
</svg>
